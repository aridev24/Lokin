
<html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="styles.css" rel="StyleSheet">
        <script src="script.js" defer></script>
    </head>
    <body id="body">
        <header class="top_bar">
            <h1 class="logo">Lokin</h1>
            <h3 class="quote">"Either you run the day or the day <br> runs you." — Jim Rohn</h3>
        </header>
        <div class="main_container">
            <div class="main">
                <h2 class="question">Ready to lock in?</h2>
                <div class="timers_container">
                    <div class="timer">
                        <h1 id="timer_id" style="font-size: 130px; line-height: 0;">25:00</h1>
                    </div>

                    <div class="timers_btn">
                        <h3 class="btn_1" id="focus_btn">Focus</h3>
                        <h3 class="btn_2" id="short_break_btn">Short Break</h3>
                        <h3 class="btn_3" id="long_break_btn">Long Break</h3>
                    </div>
                    <div class="cntrl_btns">
                        <div class="play_btn" id="play_btn_id">
                            <div id="play_icon">
                                <svg  xmlns="http://www.w3.org/2000/svg" width="40px" height="40px" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16">
                                    <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
                                </svg>
                            </div>
                        </div>
                        <div class="reset_btn" id="reset_btn_id">
                            <svg xmlns="http://www.w3.org/2000/svg" width="40px" height="40px" fill="currentColor" class="bi bi-arrow-repeat" viewBox="0 0 16 16">
                                <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41m-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9"/>
                                <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5 5 0 0 0 8 3M3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9z"/>
                            </svg>
                        </div>
                    </div>
                </div>    
            </div>
        </div>

        <div class="bottom_bar">
            <div class="left_btns">
                <div class="sound_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-music-note-beamed" viewBox="0 0 16 16">
                        <path d="M6 13c0 1.105-1.12 2-2.5 2S1 14.105 1 13s1.12-2 2.5-2 2.5.896 2.5 2m9-2c0 1.105-1.12 2-2.5 2s-2.5-.895-2.5-2 1.12-2 2.5-2 2.5.895 2.5 2"/>
                        <path fill-rule="evenodd" d="M14 11V2h1v9zM6 3v10H5V3z"/>
                        <path d="M5 2.905a1 1 0 0 1 .9-.995l8-.8a1 1 0 0 1 1.1.995V3L5 4z"/>
                    </svg>
                </div>
                <div class="tasks_btn" id="task_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-card-checklist" viewBox="0 0 16 16">
                        <path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2z"/>
                        <path d="M7 5.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 1 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0M7 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 0 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0"/>
                    </svg>
                </div>
            </div>

            <div class="right_btns">
                <div class="theme_btn" id="theme_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-palette-fill" viewBox="0 0 16 16">
                        <path d="M12.433 10.07C14.133 10.585 16 11.15 16 8a8 8 0 1 0-8 8c1.996 0 1.826-1.504 1.649-3.08-.124-1.101-.252-2.237.351-2.92.465-.527 1.42-.237 2.433.07M8 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m4.5 3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3M5 6.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m.5 6.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                    </svg>
                </div>
                <div class="settings_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-gear-wide-connected" viewBox="0 0 16 16">
                        <path d="M7.068.727c.243-.97 1.62-.97 1.864 0l.071.286a.96.96 0 0 0 1.622.434l.205-.211c.695-.719 1.888-.03 1.613.931l-.08.284a.96.96 0 0 0 1.187 1.187l.283-.081c.96-.275 1.65.918.931 1.613l-.211.205a.96.96 0 0 0 .434 1.622l.286.071c.97.243.97 1.62 0 1.864l-.286.071a.96.96 0 0 0-.434 1.622l.211.205c.719.695.03 1.888-.931 1.613l-.284-.08a.96.96 0 0 0-1.187 1.187l.081.283c.275.96-.918 1.65-1.613.931l-.205-.211a.96.96 0 0 0-1.622.434l-.071.286c-.243.97-1.62.97-1.864 0l-.071-.286a.96.96 0 0 0-1.622-.434l-.205.211c-.695.719-1.888.03-1.613-.931l.08-.284a.96.96 0 0 0-1.186-1.187l-.284.081c-.96.275-1.65-.918-.931-1.613l.211-.205a.96.96 0 0 0-.434-1.622l-.286-.071c-.97-.243-.97-1.62 0-1.864l.286-.071a.96.96 0 0 0 .434-1.622l-.211-.205c-.719-.695-.03-1.888.931-1.613l.284.08a.96.96 0 0 0 1.187-1.186l-.081-.284c-.275-.96.918-1.65 1.613-.931l.205.211a.96.96 0 0 0 1.622-.434zM12.973 8.5H8.25l-2.834 3.779A4.998 4.998 0 0 0 12.973 8.5m0-1a4.998 4.998 0 0 0-7.557-3.779l2.834 3.78zM5.048 3.967l-.087.065zm-.431.355A4.98 4.98 0 0 0 3.002 8c0 1.455.622 2.765 1.615 3.678L7.375 8zm.344 7.646.087.065z"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="tasks_container" id="task_panel">
            <div class="task_heading_container">
                <h2 class="task_heading">Tasks</h2>
            </div>

            <div class="task_list_container" id="task_list_id"></div>

            <div class="task_input">
                <input class="task_input_field"  id="task_input_id" type="text" maxlength="38" placeholder="Add Tasks">
                <div class="add_task_btn" id="add_task_btn_id">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-plus-square" viewBox="0 0 16 16">
                        <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="themes_container" id="theme_panel">
            <div class="themes_heading_container">
                <h2 class="themes_heading">Themes</h2>
            </div>
            <div class="themes_selector">

                <div class="themes_row">
                    <div id="theme1" class="theme_1" style="background-image: url(assets/ancient_forest.jpg);"></div>
                    <div id="theme2" class="theme_2" style="background-image: url(assets/autumn.jpg);"></div>
                </div>

                <div class="themes_row">
                    <div id="theme3" class="theme_1" style="background-image: url(assets/beautiful_moonlit.jpg);"></div>
                    <div id="theme4" class="theme_2" style="background-image: url(assets/breathtaking_mountain.jpg);"></div>
                </div>

                <div class="themes_row">
                    <div id="theme5" class="theme_1" style="background-image: url(assets/city_at_midnight.jpg);"></div>
                    <div id="theme6" class="theme_2" style="background-image: url(assets/cliffs_overlooking.jpg);"></div>
                </div>

                <div class="themes_row">
                    <div id="theme7" class="theme_1" style="background-image: url(assets/countryside_during_spring.jpg);"></div>
                    <div id="theme8" class="theme_2" style="background-image: url(assets/lucid-origin_Cinematic_anime_landscape_of_a_peaceful_Japanese-inspired_city_street_at_night_d-0.jpg);"></div>
                </div>

                <div class="themes_row">
                    <div id="theme9" class="theme_1" style="background-image: url(assets/mountain-valley.jpg);"></div>
                    <div id="theme10" class="theme_2" style="background-image: url(assets/night-mountain-lake.jpg);"></div>
                </div>

                <div class="themes_row">
                    <div id="theme11" class="theme_1" style="background-image: url(assets/lucid-origin_Cinemocean_at_sunset.jpg);"></div>
                    <div id="theme12" class="theme_2" style="background-image: url(assets/snowy_mountain.jpg);"></div>
                </div>

                <div class="themes_row">
                    <div id="theme13" class="theme_1" style="background-image: url(assets/valley_at_night.jpg);"></div>
                    <div id="theme14" class="theme_2" style="background-image: url(assets/wheat_fields.jpg);"></div>
                </div>

            </div>
        </div>

    </body>
</html>
